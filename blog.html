<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog – Bunnies Indonesia</title>
<meta name="description" content="Tulis dan baca blog sesama pengguna Bunnies Indonesia.">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=41"><link rel="stylesheet" href="css/base.css?v=41"><link rel="stylesheet" href="css/identity.css?v=41"><link rel="stylesheet" href="css/search.css?v=41"><link rel="stylesheet" href="css/tanya.css?v=41">
<link rel="stylesheet" href="css/share.css?v=41"><link rel="stylesheet" href="css/komentar.css?v=41"><link rel="stylesheet" href="css/nav.css?v=41">
<link rel="stylesheet" href="css/brand-skin.css?v=41"><link rel="stylesheet" href="css/modern.css?v=41"><link rel="stylesheet" href="css/padat.css?v=41"><link rel="stylesheet" href="css/fokus.css?v=41">
</head><body class="sp">
<header class="sbar"><div class="swrap">
  <a class="logo" href="./" aria-label="Bunnies Indonesia, ke beranda"><img src="assets/brand/logo-mark.svg" alt="" width="32" height="32"><span>bunnies</span></a>
  <div class="hbar" id="hbar"></div>
</div>
<script src="js/nav.js?v=41"></script></header>
<main class="swrap">
  <section id="listView" hidden>
    <div class="thead"><h1>Blog</h1><button class="btn green" id="writeBtn" type="button">Tulis</button></div>
    <nav class="stabs" id="catTabs" aria-label="Kategori"></nav>
    <div id="plist"></div>
    <p id="pinfo" class="sinfo" role="status"></p>
    <button class="btn more" id="more" type="button" hidden>Muat lagi</button>
  </section>
  <section id="detailView" hidden></section>
</main>
<dialog id="writeDlg" class="dlg"><form id="writeForm">
  <h2>Tulis di blog</h2>
  <input id="wTitle" placeholder="Judul (min. 5 huruf)" minlength="5" maxlength="150" required>
  <textarea id="wBody" placeholder="Isi tulisan (min. 20 huruf)" minlength="20" maxlength="20000" style="min-height:220px" required></textarea>
  <select id="wCat" aria-label="Kategori"></select>
  <p class="msg" id="writeMsg" role="status"></p>
  <div class="row"><button class="btn alt" type="button" id="writeCancel">Batal</button><button class="btn green">Terbitkan</button></div>
  <p class="meta">Tulisan langsung tampil publik dengan nama tampilmu. Jangan menulis data pribadi atau konten yang melanggar hukum.</p>
</form></dialog>
<dialog id="repDlg" class="dlg"><form id="repForm">
  <h2>Laporkan</h2>
  <select id="repReason" aria-label="Alasan">
    <option value="spam">Spam atau iklan</option><option value="sara">Ujaran kebencian / SARA</option>
    <option value="porno">Konten dewasa</option><option value="pribadi">Memuat data pribadi</option><option value="lainnya">Lainnya</option>
  </select>
  <p class="msg" id="repMsg" role="status"></p>
  <div class="row"><button class="btn alt" type="button" id="repCancel">Batal</button><button class="btn green">Kirim laporan</button></div>
</form></dialog>
<script src="js/config.js?v=41"></script>
<script src="js/kategori.js?v=41"></script>
<script src="js/state.js?v=41"></script>
<script src="js/bias.js?v=41"></script>
<script src="js/share.js?v=41"></script>
<script src="js/blog.js?v=41"></script>
</body></html>
