# Perbarui angka tayangan chart YouTube tiap hari.
# Wajib sekali: Settings > Secrets and variables > Actions > New repository secret: YOUTUBE_API_KEY
name: Perbarui chart YouTube
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"      # 05.00 WIB
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Simpan bila berubah
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/youtube.json
          git diff --cached --quiet || (git commit -m "Perbarui chart YouTube" && git push)
