# Niflax v25: bangun halaman statis (SEO) lalu terbitkan ke GitHub Pages.
# Wajib sekali: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Opsional: Settings > Secrets and variables > Actions > Variables > SITE_URL = https://niflax.com (setelah domain aktif).
name: Terbitkan situs
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"      # tulisan/pertanyaan baru ikut terbit paling lambat ~30 menit
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bangun halaman statis
        run: node tools/build-static.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
